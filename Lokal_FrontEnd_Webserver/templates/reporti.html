<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Generation · Reporti</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-mark">CG</div>
        <div>
          <div class="brand-name">Code Generation</div>
          <div class="brand-subtitle">Dashboard</div>
        </div>
      </div>

      <nav class="nav">
        <a class="nav-item" href="/">Home</a>
        <a class="nav-item active" href="/reporti">Reporti</a>
      </nav>

      <div class="menu-section">
        <div class="menu-label">Doplnky</div>
        <button class="nav-button" type="button" data-run="main">Spustiť · main</button>
        <button class="nav-button" type="button" data-run="remove_csv">Spustiť · remove_csv</button>
        <button class="nav-button" type="button" data-run="report">Spustiť · report</button>
      </div>
    </aside>

    <main class="main-panel">
      <div class="topline">
        <div>
          <div class="eyebrow">Reporty</div>
          <h1>Vytváranie a <span>správa testov.</span></h1>
        </div>
        <div class="pill">Pridávanie projektov a generovanie dát</div>
      </div>

      <section class="panel-block">
        <div class="panel-header">
          <h2>Vyhľadávanie</h2>
        </div>
        <div class="filters search-panel">
          <input id="report-search" type="search" placeholder="Hľadať projekty alebo jazyky…" aria-label="Hľadať projekty alebo jazyky">
          <button id="new-project-button" type="button">Vytvoriť test</button>
        </div>
      </section>

      <section class="panel-block">
        <div class="panel-header">
          <h2>Zoznam projektov</h2>
        </div>
        <div class="project-list">
          __PROJECT_ROWS__
        </div>
      </section>
    </main>
  </div>

  <div id="model-detail-dialog" class="modal hidden" aria-hidden="true">
    <div class="modal-card modal-wide">
      <div class="modal-header">
        <h3 id="model-detail-title">Detail modelu</h3>
        <button type="button" class="close-dialog" aria-label="Zavrieť">×</button>
      </div>
      <div id="model-detail-content" class="detail-content"></div>
      <div class="dialog-actions">
        <button id="close-model-detail" type="button" class="secondary">Zavrieť</button>
      </div>
    </div>
  </div>

  <div id="project-dialog" class="modal hidden" aria-hidden="true">
    <div class="modal-card modal-wide">
      <div class="modal-header">
        <h3>Vytvorenie projektu</h3>
        <button type="button" class="close-dialog" aria-label="Zavrieť">×</button>
      </div>
      <form id="project-form" method="post" action="/reporti/create">
        <div class="form-grid">
          <label class="field">
            <span>Názov projektu</span>
            <input name="project_name" type="text" placeholder="T1" required>
          </label>

          <label class="field">
            <span>Prompt</span>
            <textarea name="prompt" rows="6" placeholder="Napíšte prompt..." required></textarea>
          </label>

          <label class="field">
            <span>Test data</span>
            <textarea name="tests_data" rows="6" placeholder="Zadajte test_data.txt..." required></textarea>
          </label>

          <label class="field">
            <span>Setup text</span>
            <textarea name="setup_text" rows="8" placeholder="models=..."></textarea>
          </label>
        </div>

        <div class="form-grid-compact">
          <label class="field">
            <span>Models</span>
            <select name="models" multiple size="8">
              __MODEL_OPTIONS__
            </select>
          </label>

          <label class="field">
            <span>Language</span>
            <select name="language">
              __LANGUAGE_OPTIONS__
            </select>
          </label>

          <label class="field">
            <span>num_generations</span>
            <input name="num_generations" type="number" min="1" value="50" required>
          </label>

          <label class="field">
            <span>Pridaj text do setup.txt</span>
            <textarea name="setup_extra" rows="5" placeholder="temperature=0..."></textarea>
          </label>
        </div>
      </form>
      <div class="dialog-actions">
        <button type="button" class="secondary close-dialog">Zrušiť</button>
        <button type="submit" form="project-form">Uložiť projekt</button>
      </div>
    </div>
  </div>

  <div id="run-dialog" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Spúšťanie skriptu</h3>
        <button type="button" class="close-dialog" aria-label="Zavrieť">×</button>
      </div>
      <pre id="run-output" class="terminal-output"></pre>
      <div class="dialog-actions">
        <button id="close-run-dialog" type="button" class="secondary">Zavrieť</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
